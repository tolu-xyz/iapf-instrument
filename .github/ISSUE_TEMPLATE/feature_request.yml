name: Feature request
description: Suggest something the instrument should do that it doesn't yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: What's missing, and why would it help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried as a workaround?
    validations:
      required: false
