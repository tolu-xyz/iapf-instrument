[project]
name = "iapf-instrument"
version = "0.1.0"
description = "Evaluation instrument for the Inclusive AI Prompting Framework — checks AI systems for cognitive accessibility."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["certifi"]

[project.scripts]
iapf = "iapf.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iapf*"]
